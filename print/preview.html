<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tarjeta Sandra Cáceres — presentación</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { display: grid; place-items: center; padding: 70px; color: #102b3f; background: radial-gradient(circle at 22% 14%, #fffdf8, transparent 34%), linear-gradient(135deg, #e8dfd1, #f4efe5 58%, #ddd1c0); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(1420px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 38px; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 54px; font-weight: 400; letter-spacing: -2px; }
    header p { max-width: 470px; margin: 0; color: #52697a; font-size: 15px; line-height: 1.6; text-align: right; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; }
    figure { margin: 0; }
    figcaption { margin: 0 0 14px 8px; color: #52697a; font-size: 12px; font-weight: 800; letter-spacing: 3px; }
    img { display: block; width: 100%; aspect-ratio: 96 / 61; border-radius: 4px; box-shadow: 0 28px 54px rgba(16, 43, 63, .2), 0 5px 14px rgba(16, 43, 63, .12); }
    .spec { display: flex; justify-content: center; gap: 30px; margin-top: 34px; color: #52697a; font-size: 12px; }
    .spec span + span::before { content: '·'; margin-right: 30px; color: #ff6a5f; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Una tarjeta que abre<br>una conversación.</h1>
      <p>Marca personal ejecutiva, con QR estable hacia sandracaceres.eu y una identidad propia que complementa el respaldo profesional.</p>
    </header>
    <div class="cards">
      <figure><figcaption>FRENTE</figcaption><img src="../assets/card/card-front.svg" alt="Frente"></figure>
      <figure><figcaption>REVERSO</figcaption><img src="../assets/card/card-back.svg" alt="Reverso"></figure>
    </div>
    <div class="spec"><span>90 × 55 mm final</span><span>3 mm de sangrado</span><span>QR hacia sandracaceres.eu</span><span>Laminado mate sugerido</span></div>
  </main>
</body>
</html>
