<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tarjeta Sandra Cáceres — archivo de impresión</title>
  <style>
    @page { size: 96mm 61mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: white; }
    .page { width: 96mm; height: 61mm; margin: 0; break-after: page; page-break-after: always; overflow: hidden; }
    .page:last-child { break-after: auto; page-break-after: auto; }
    img { display: block; width: 96mm; height: 61mm; }
  </style>
</head>
<body>
  <section class="page" aria-label="Frente"><img src="../assets/card/card-front.svg" alt="Frente de la tarjeta"></section>
  <section class="page" aria-label="Reverso"><img src="../assets/card/card-back.svg" alt="Reverso de la tarjeta"></section>
</body>
</html>
